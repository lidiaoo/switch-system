<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>rEFInd 启动切换器</title>
    <link href="./styles.css" rel="stylesheet" />
  </head>
  <body>
    <main>
      <header>
        <h1>rEFInd 启动切换器</h1>
        <p id="status">正在扫描 rEFInd 变量目录…</p>
      </header>

      <section aria-label="可启动系统" id="systems"></section>

      <section class="directory">
        <label for="vars-dir">变量目录</label>
        <input id="vars-dir" placeholder="留空则自动扫描 EFI/refind/vars" spellcheck="false" type="text" />
        <div class="actions">
          <button id="use-directory" type="button">使用此目录</button>
          <button class="secondary" id="refresh" type="button">刷新</button>
        </div>
      </section>

      <section aria-label="应用设置" class="settings">
        <h2>应用设置</h2>
        <label class="setting">
          <span class="setting-text">
            <strong>开机启动</strong>
            <small>登录系统后自动启动，常驻托盘待命</small>
            <small class="setting-state" id="autostart-state"></small>
          </span>
          <input id="autostart" type="checkbox" />
        </label>
        <label class="setting">
          <span class="setting-text">
            <strong>启动时隐藏主界面</strong>
            <small>启动后不直接打开主菜单，仅显示在托盘</small>
          </span>
          <input id="start-in-tray" type="checkbox" />
        </label>
        <label class="setting">
          <span class="setting-text">
            <strong>隐藏程序（任务栏/Dock）</strong>
            <small>Linux/Windows 不显示任务栏图标，macOS 不显示 Dock 图标</small>
          </span>
          <input id="hide-from-dock-taskbar" type="checkbox" />
        </label>
        <div class="setting">
          <span class="setting-text">
            <strong>点击窗口 ❌ 时</strong>
            <small>可在托盘菜单「显示主窗口」中重新打开</small>
          </span>
          <select id="close-action">
            <option value="tray">最小化到托盘</option>
            <option value="quit">退出程序</option>
          </select>
        </div>
        <p id="settings-message" role="status"></p>
        <button class="link hidden" id="login-items" type="button">
          打开「登录项与扩展」设置
        </button>
      </section>

      <p id="message" role="status"></p>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
