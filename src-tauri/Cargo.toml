[package]
name = "refind-switcher"
version = "0.1.0"
description = "Select the next boot system from the system tray by updating rEFInd's PreviousBoot variable"
authors = ["you"]
edition = "2021"

[lib]
name = "refind_switcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

